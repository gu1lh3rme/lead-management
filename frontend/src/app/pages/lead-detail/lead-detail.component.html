<div class="container">
  <div class="header">
    <button mat-icon-button (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>Detalhes do Lead</h1>
    <button mat-raised-button color="primary" (click)="onEdit()">
      <mat-icon>edit</mat-icon> Editar
    </button>
  </div>

  @if (loading) {
    <div class="loading-container">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  } @else if (lead) {
    <div class="detail-card">
      <div class="info-grid">
        <div class="info-item">
          <span class="label">Nome</span>
          <span class="value">{{ lead.name }}</span>
        </div>
        <div class="info-item">
          <span class="label">Email</span>
          <span class="value">{{ lead.email }}</span>
        </div>
        <div class="info-item">
          <span class="label">Status</span>
          <span [class]="'status-badge status-' + lead.status.toLowerCase()">{{ getLeadStatusLabel(lead.status) }}</span>
        </div>
        <div class="info-item">
          <span class="label">Criado em</span>
          <span class="value">{{ lead.createdAt | date:'MM/dd/yyyy HH:mm' }}</span>
        </div>
        <div class="info-item">
          <span class="label">Última Atualização</span>
          <span class="value">{{ lead.updatedAt | date:'MM/dd/yyyy HH:mm' }}</span>
        </div>
      </div>
    </div>

    <mat-divider></mat-divider>

    <app-lead-tasks [leadId]="lead.id"></app-lead-tasks>
  }
</div>
